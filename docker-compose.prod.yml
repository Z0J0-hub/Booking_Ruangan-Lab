version: '3.8'

# Production environment docker-compose configuration
# Used by Jenkins pipeline for production deployments

services:
  db:
    image: postgres:14-alpine
    container_name: lab-booking-prod-db
    restart: always
    environment:
      POSTGRES_DB: lab_booking_prod
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod-db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKER_IMAGE_BACKEND:-docker.io/YOUR_USERNAME/lab-booking-backend:latest}
    container_name: lab-booking-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lab_booking_prod
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 900
      CORS_ORIGIN: ${CORS_ORIGIN:-https://lab-booking.telkom.ac.id}
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-docker.io/YOUR_USERNAME/lab-booking-frontend:latest}
    container_name: lab-booking-prod-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Optional: Redis for session caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: lab-booking-prod-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - prod-redis-data:/data
    networks:
      - prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prod-db-data:
  prod-redis-data:

networks:
  prod-network:
    driver: bridge
