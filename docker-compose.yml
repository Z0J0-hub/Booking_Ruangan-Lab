name: library-booking-local
services:
  frontend:
    image: reservasi-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set public Supabase URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set public Supabase key}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  frontend:
    internal: true
