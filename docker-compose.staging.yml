version: '3.8'

# Staging environment docker-compose configuration
# Used by Jenkins pipeline for staging deployments

services:
  db:
    image: mysql:8.4
    container_name: lab-booking-staging-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lab_booking_staging
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - staging-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-booking-staging-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lab_booking_staging
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8081,http://localhost:5173
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - staging-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lab-booking-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - staging-network

volumes:
  staging-db-data:

networks:
  staging-network:
    driver: bridge
