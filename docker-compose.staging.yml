name: library-booking-staging
services:
  frontend:
    image: reservasi-frontend:${RELEASE_TAG:?Use an immutable scanned release tag}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports: ["127.0.0.1:8082:8080"]
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  frontend:
    internal: true
