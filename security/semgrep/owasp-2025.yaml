        "cwe": [
          "CWE-295"
        ],
        "confidence": "MEDIUM",
        "category": "security",
        "scope": "Representative project checks; partial category coverage, not OWASP certification"
      },
      "pattern-either": [
        {
          "pattern": "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
        },
        {
          "pattern": "$CLIENT({ ..., rejectUnauthorized: false, ... })"
        }
      ]
    },
    {
