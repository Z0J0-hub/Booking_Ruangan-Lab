# Project rules mapped to OWASP Top 10:2025. Each category is only partially covered.
{
  "rules": [
    {
      "id": "owasp2025-a01-browser-admin-api",
      "languages": [
        "javascript",
        "typescript"
      ],
      "message": "Privileged Auth admin API must not be used from browser source.",
      "severity": "ERROR",
      "metadata": {
        "owasp": [
          "A01:2025 - Broken Access Control"
        ],
        "cwe": [
          "CWE-862"
        ],
        "confidence": "MEDIUM",
        "category": "security",
        "scope": "Representative project checks; partial category coverage, not OWASP certification"
      },
      "patterns": [
        {
          "pattern": "$CLIENT.auth.admin.$METHOD(...)"
        }
      ],
      "paths": {
        "include": [
          "/src/**"
        ]
      }
    },
    {
      "id": "owasp2025-a02-disabled-tls",
      "languages": [
        "javascript",
        "typescript"
      ],
      "message": "TLS certificate verification must not be disabled.",
      "severity": "ERROR",
      "metadata": {
        "owasp": [
          "A02:2025 - Security Misconfiguration"
